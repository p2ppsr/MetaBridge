services:
  api:
    build:
      context: ./apps/api
    image: metabridge-api:local
    environment:
      NODE_ENV: production
      PORT: "8080"
      FRONTEND_URL: "http://localhost"
      HANDCASH_APP_ID: "${HANDCASH_APP_ID}"
      HANDCASH_APP_SECRET: "${HANDCASH_APP_SECRET}"
    ports:
      - "8080:8080"  

  web:
    build:
      context: ./apps/web
    image: metabridge-web:local
    expose:
      - "8080"      

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - api
      - web
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro